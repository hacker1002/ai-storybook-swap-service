[project]
name = "remix-swap-service"
version = "0.1.0"
description = "Remix Swap Service — editor-session gateway for the Remix Editor sub-app (ADR-052). FastAPI + asyncpg, no Supabase SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
]
